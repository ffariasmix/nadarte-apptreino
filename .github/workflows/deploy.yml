name: Coleta + Publica (App Treino)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar no Cloudflare? (false = so validar)"
        type: boolean
        default: false
      diag:
        description: "Modo diagnostico? (rapido, sem uso-do-app; grava history/diag.json)"
        type: boolean
        default: false
  schedule:
    # 12:30 UTC = 09:30 BRT. Movido de 03:00 BRT para fora da janela da Ocupação (03:00-09:00 BRT),
    # evitando dividir a cota de rate-limit das chaves Pacto (handoff Coleta Única, 04/08/2026).
    - cron: "30 12 * * *"

concurrency:
  group: apptreino-build
  cancel-in-progress: false

permissions:
  contents: write   # necessario para salvar history/serie.json de volta no repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Coletar dados da API PACTO
        env:
          PACTO_KEY_716NORTE: ${{ secrets.PACTO_KEY_716NORTE }}
          PACTO_KEY_905SUL:    ${{ secrets.PACTO_KEY_905SUL }}
          PACTO_KEY_604NORTE:  ${{ secrets.PACTO_KEY_604NORTE }}
          PACTO_KEY_LAGONORTE: ${{ secrets.PACTO_KEY_LAGONORTE }}
          PACTO_KEY_LAGOSUL:   ${{ secrets.PACTO_KEY_LAGOSUL }}
          PACTO_KEY_NATAL:     ${{ secrets.PACTO_KEY_NATAL }}
          PACTO_DIAG: ${{ inputs.diag }}
        run: python scripts/pacto_fetch_treino.py

      - name: Montar + GATE (nao publica se o dado nao fechar)
        run: python scripts/build_treino.py

      - name: Gravar CRM no D1 (apptreino_crm) p/ a Agenda Tatica ler (runner nao le o pages.dev)
        # so nas publicacoes (cron diario ou run manual com deploy=true), quando o feed fechou o GATE
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          python scripts/crm_to_d1.py public/agenda_treino.json > crm.sql
          echo "Linhas SQL do CRM: $(wc -l < crm.sql)"
          npx --yes wrangler@3 d1 execute nadarte_agenda --remote --file=crm.sql
          # app_status (Prontuario 360): usaApp/treinoVencido de TODOS os alunos ativos
          python scripts/app_status_to_d1.py public/app_status.json > app_status.sql
          echo "Linhas SQL do app_status: $(wc -l < app_status.sql)"
          npx --yes wrangler@3 d1 execute nadarte_agenda --remote --file=app_status.sql


      # ---- Porteiro de responsividade -------------------------------------
      # Roda DEPOIS de gerar o HTML e ANTES de publicar. Mede a página num
      # navegador de verdade, em celular/tablet/tablet-paisagem, e reprova se
      # sobrar botão ou dado fora da tela. O linter estático não pega isso:
      # ele deu 0 erro em três painéis que estavam quebrados no celular.
      - name: Buscar o porteiro de responsividade
        uses: actions/checkout@v4
        with:
          repository: ffariasmix/nadarte-dashboard-automacao
          path: .porteiro
      - name: Instalar navegador
        run: |
          cd .porteiro && npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Conferir se o medidor esta confiavel
        working-directory: .porteiro
        run: node scripts/teste_medidor.mjs
      - name: Medir responsividade do painel gerado
        run: |
          node .porteiro/scripts/ux_mobile_lint.mjs public/index.html
          node .porteiro/scripts/medir_responsivo.mjs --larguras 390,768,1024 --capturas ./capturas public/index.html
      - name: Anexar capturas de quem reprovou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsividade-${{ github.sha }}
          path: capturas/
          if-no-files-found: ignore

      - name: Publicar no Cloudflare Pages
        # publica automaticamente no cron diario; no run manual, so se marcar deploy=true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler
          wrangler pages deploy public --project-name=nadarte-apptreino --branch=main

      - name: Salvar diagnostico (modo diag) no repo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diag == true }}
        run: |
          if [ -f history/diag.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add history/diag.json
            git commit -m "diag: distribuicao de situacao" || echo "sem mudancas no diag"
            git push || echo "nada a enviar"
          fi

      - name: Salvar historico (agregado, sem PII) no repo
        # so nas publicacoes (cron diario ou run manual com deploy=true)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        run: |
          if [ -f history/serie.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add history/serie.json history/modalidade_cache.json history/isa_history.json 2>/dev/null || git add history/serie.json
            git commit -m "hist: snapshot diario + cache modalidade + isa (backtest)" || echo "sem mudancas no historico"
            git push || echo "nada a enviar"
          fi
